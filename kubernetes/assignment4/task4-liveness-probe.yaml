apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
data:
  APP_ENV: "homework_4"
  APP_OWNER: "yelena_zamansky"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-task
  template:                    
    metadata:
      labels:
        app: nginx-task        
    spec:                      
      volumes:
        - name: task-pv-storage
          persistentVolumeClaim:
            claimName: nginx-pv-claim     
      containers:
        - name: task-pv-container
          image: nginx
          envFrom:
            - configMapRef:
                name: nginx-config
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          ports:
            - containerPort: 80
          volumeMounts:
            - mountPath: "/usr/share/nginx/html"
              name: task-pv-storage